<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Add Property</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

<link rel="stylesheet" href="{{ url_for('static', filename='css/branding.css') }}">
<link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='img/school_property_logo.png') }}">
</head>

<body>

<div class="container mt-5">

    <h1>Add School Property</h1>

    <p class="text-muted">
        Enter the information of the school property.
    </p>

    {% with messages = get_flashed_messages(
        with_categories=true
    ) %}

        {% for category, message in messages %}

            <div class="alert alert-{{ category }}">
                {{ message }}
            </div>

        {% endfor %}

    {% endwith %}


    <form method="POST">

        <input
            type="hidden"
            name="csrf_token"
            value="{{ csrf_token() }}"
        >


        <div class="mb-3">

            <label class="form-label">
                Property Code
            </label>

            <input
                type="text"
                name="property_code"
                class="form-control"
                placeholder="Example: SP-001"
                required
            >

        </div>


        <div class="mb-3">

            <label class="form-label">
                Property Name
            </label>

            <input
                type="text"
                name="property_name"
                class="form-control"
                placeholder="Example: Desktop Computer"
                required
            >

        </div>


        <div class="mb-3">

            <label class="form-label">
                Category
            </label>

<select name="category" class="form-select" required>

    <option value="">Select Category</option>

    {% for category in categories %}

        <option value="{{ category.id }}">

            {{ category.category_name }}

        </option>

    {% endfor %}
    
</select>

        </div>


        <div class="mb-3">

            <label class="form-label">
                Quantity
            </label>

            <input
                type="number"
                name="quantity"
                class="form-control"
                min="1"
                value="1"
                required
            >

        </div>


        <div class="mb-3">

            <label class="form-label">
                Condition
            </label>

            <select
                name="condition"
                class="form-select"
                required>

                <option value="">
                    Select Condition
                </option>

                <option value="Good">
                    Good
                </option>

                <option value="Fair">
                    Fair
                </option>

                <option value="Needs Repair">
                    Needs Repair
                </option>

                <option value="Damaged">
                    Damaged
                </option>

            </select>

        </div>


        <div class="mb-3">

            <label class="form-label">
                Location
            </label>

            <input
                type="text"
                name="location"
                class="form-control"
                placeholder="Example: Computer Laboratory"
                required
            >

        </div>


        <div class="mb-3">

            <label class="form-label">
                Date Acquired
            </label>

            <input
                type="date"
                name="date_acquired"
                class="form-control"
            >

        </div>


        <div class="mb-3">

            <label class="form-label">
                Status
            </label>

            <select
                name="status"
                class="form-select"
                required>

                <option value="Available">
                    Available
                </option>

                <option value="In Use">
                    In Use
                </option>

                <option value="Under Repair">
                    Under Repair
                </option>

                <option value="Disposed">
                    Disposed
                </option>

            </select>

        </div>


        <button
            type="submit"
            class="btn btn-primary">

            Save Property

        </button>


        <a
            href="{{ url_for('property.list_properties') }}"
            class="btn btn-secondary">

            Cancel

        </a>

    </form>

</div>

</body>

</html>
