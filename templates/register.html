<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Register - School Property System</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

<link rel="stylesheet" href="{{ url_for('static', filename='css/branding.css') }}">
<link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='img/school_property_logo.png') }}">
</head>

<body>

<div class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-md-6">

            <div class="card shadow">

                <div class="card-body">

                    <h2 class="text-center mb-4">
                        Create Account
                    </h2>

                    {% with messages = get_flashed_messages(
                        with_categories=true
                    ) %}

                        {% for category, message in messages %}

                            <div class="alert alert-{{ category }}">
                                {{ message }}
                            </div>

                        {% endfor %}

                    {% endwith %}

                    <form method="POST">

                        <input
                            type="hidden"
                            name="csrf_token"
                            value="{{ csrf_token() }}"
                        >

                        <div class="mb-3">

                            <label class="form-label">
                                Full Name
                            </label>

                            <input
                                type="text"
                                name="full_name"
                                class="form-control"
                                required
                            >

                        </div>

                        <div class="mb-3">

                            <label class="form-label">
                                Email
                            </label>

                            <input
                                type="email"
                                name="email"
                                class="form-control"
                                required
                            >

                        </div>

                        <div class="mb-3">

                            <label class="form-label">
                                Password
                            </label>

                            <input
                                type="password"
                                name="password"
                                class="form-control"
                                minlength="8"
                                required
                            >

                        </div>

                        <div class="mb-3">

                            <label class="form-label">
                                Confirm Password
                            </label>

                            <input
                                type="password"
                                name="confirm_password"
                                class="form-control"
                                minlength="8"
                                required
                            >

                        </div>

                        <button
                            type="submit"
                            class="btn btn-primary w-100">

                            Register

                        </button>

                    </form>

                    <p class="text-center mt-3">

                        Already have an account?

                        <a href="{{ url_for('auth.login') }}">
                            Login here
                        </a>

                    </p>

                </div>

            </div>

        </div>

    </div>

</div>

</body>

</html>
