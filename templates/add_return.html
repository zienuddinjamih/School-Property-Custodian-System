
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Record Property Return</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='css/branding.css') }}">
<link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='img/school_property_logo.png') }}">
</head>

<body class="bg-light">

<div class="container mt-5 mb-5">

    <h2>Record Property Return</h2>
    <p class="text-muted">
        Enter the details of the returned school property.
    </p>

    {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, message in messages %}
            <div class="alert alert-{{ category }}">
                {{ message }}
            </div>
        {% endfor %}
    {% endwith %}

    <form method="POST"
          action="{{ url_for('returns.add_return') }}">

        <input type="hidden"
               name="csrf_token"
               value="{{ csrf_token() }}">

        <div class="mb-3">
            <label class="form-label">
                Select Property
            </label>

            <select name="property_id"
                    id="property_id"
                    class="form-select"
                    required>

                <option value="">
                    Select Property
                </option>

                {% for property in properties %}
                <option value="{{ property.id }}">
                    {{ property.property_code }} -
                    {{ property.property_name }}
                </option>
                {% endfor %}

            </select>
        </div>

        


<div class="mb-3">
    <label class="form-label">Returned By</label>

    <select name="returned_by"
            id="returned_by"
            class="form-select"
            required>

        <option value="">Select Borrower</option>

        
        
        {% for borrower in borrowers %}
        <option value="{{ borrower[1] }}"
                data-property="{{ borrower[0] }}"
                data-remaining="{{ borrower[2] }}">
            {{ borrower[1] }} (Remaining: {{ borrower[2] }})
        </option>
        {% endfor %}

    </select>
</div>

        
        <div class="mb-3">
            <label class="form-label">Quantity</label>

            <input type="number"
                name="quantity"
                id="return_quantity"
                class="form-control"
                min="1"
                placeholder="Select borrower first"
                disabled
                required>

            <small id="quantity_info" class="text-muted">
                Please select a property and borrower first.
            </small>
        </div>


        <div class="mb-3">
            <label class="form-label">
                Date Returned
            </label>

            <input type="date"
                   name="date_returned"
                   class="form-control"
                   required>
        </div>

        <div class="mb-3">
            <label class="form-label">
                Condition
            </label>

            <select name="condition_status"
                    class="form-select"
                    required>

                <option value="Good">Good</option>
                <option value="Fair">Fair</option>
                <option value="Needs Repair">
                    Needs Repair
                </option>
                <option value="Damaged">Damaged</option>

            </select>
        </div>

        <div class="mb-3">
            <label class="form-label">
                Remarks
            </label>

            <textarea name="remarks"
                      class="form-control"
                      rows="3"
                      placeholder="Optional remarks"></textarea>
        </div>

        <button type="submit"
                id="saveReturnButton"
                class="btn btn-primary"
                disabled>
            Save Return
    </button>

        <a href="{{ url_for('returns.list_returns') }}"
           class="btn btn-secondary">
            Cancel
        </a>

    </form>

</div>


<script>
document.addEventListener("DOMContentLoaded", function () {

    const propertySelect = document.getElementById("property_id");
    const borrowerSelect = document.getElementById("returned_by");
    const quantityInput = document.getElementById("return_quantity");
    const quantityInfo = document.getElementById("quantity_info");
    const saveButton = document.getElementById("saveReturnButton");

    // Store existing borrower records
    const borrowers = Array.from(borrowerSelect.options)
        .filter(option => option.value !== "")
        .map(option => ({
            name: option.value,
            propertyId: option.dataset.property,
            remaining: Number(option.dataset.remaining),
            label: option.textContent.trim()
        }));


    // Filter borrowers by selected property
    function updateBorrowers() {

        const selectedProperty = propertySelect.value;

        borrowerSelect.innerHTML =
            '<option value="">Select Borrower</option>';

        borrowers.forEach(borrower => {

            if (borrower.propertyId === selectedProperty) {

                const option = document.createElement("option");

                option.value = borrower.name;
                option.textContent = borrower.label;
                option.dataset.remaining = borrower.remaining;

                borrowerSelect.appendChild(option);
            }
        });

        borrowerSelect.disabled =
            borrowerSelect.options.length === 1;

        updateQuantityLimit();
    }


    // Update maximum return quantity
    function updateQuantityLimit() {

        const selectedOption = borrowerSelect.selectedOptions[0];

        const remaining = Number(
            selectedOption?.dataset.remaining || 0
        );

        if (remaining > 0) {

            quantityInput.disabled = false;
            quantityInput.max = remaining;
            quantityInput.value = 1;

        } else {

            quantityInput.disabled = true;
            quantityInput.removeAttribute("max");
            quantityInput.value = "";
        }

        validateQuantity();
    }

    // Validate return quantity
    function validateQuantity() {

        const selectedOption = borrowerSelect.selectedOptions[0];

        const remaining = Number(
            selectedOption?.dataset.remaining || 0
        );

        const quantity = Number(quantityInput.value);

        saveButton.disabled = true;

        if (!propertySelect.value) {

            quantityInfo.textContent =
                "Please select a property first.";

            quantityInfo.className = "text-muted";

        } else if (borrowerSelect.options.length === 1) {

            quantityInfo.textContent =
                "No outstanding borrowed units for this property.";

            quantityInfo.className = "text-warning";

        } else if (!borrowerSelect.value || remaining <= 0) {

            quantityInfo.textContent =
                "Please select a borrower first.";

            quantityInfo.className = "text-muted";

        } else if (quantity < 1 || !Number.isInteger(quantity)) {

            quantityInfo.textContent =
                "Please enter a valid quantity.";

            quantityInfo.className = "text-danger";

        } else if (quantity > remaining) {

            quantityInfo.textContent =
                "Only " + remaining + " unit(s) can be returned.";

            quantityInfo.className = "text-danger";

        } else {

            quantityInfo.textContent =
                "Outstanding borrowed quantity: " +
                remaining + " unit(s).";

            quantityInfo.className = "text-success";

            saveButton.disabled = false;
        }
    }


    // Event listeners
    propertySelect.addEventListener(
        "change", updateBorrowers
    );

    borrowerSelect.addEventListener(
        "change", updateQuantityLimit
    );

    quantityInput.addEventListener(
        "input", validateQuantity
    );


    // Initialize form
    updateBorrowers();

});
</script>

</body>
</html>
